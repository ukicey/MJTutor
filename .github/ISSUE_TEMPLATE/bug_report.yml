name: "问题报告 / Bug report / 不具合報告"
description: "报告安装、工具调用、牌谱导入或界面问题"
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传数据库、访问密钥，或任何不愿公开的真实牌谱。

  - type: textarea
    id: problem
    attributes:
      label: "问题描述 / Problem / 問題"
      description: "发生了什么？你原本期待什么结果？"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤 / Steps to reproduce / 再現手順"
      placeholder: |
        1. 在新任务中发送……
        2. MJTutor 调用了……
        3. 出现……
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "MJTutor 版本 / Version / バージョン"
      placeholder: "例如 v0.3.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "运行环境 / Environment / 実行環境"
      description: "操作系统，以及 Codex 桌面端或 CLI"
      placeholder: "例如 macOS 15, Codex desktop"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: "已脱敏的诊断信息 / Sanitized diagnostics / 機密情報を除いた診断情報"
      description: "可粘贴错误信息或截图，但请先移除账号、Token 和私人牌谱内容。"
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: "隐私确认 / Privacy / プライバシー"
      options:
        - label: "我已确认内容中不含数据库、访问密钥或其他不愿公开的信息。"
          required: true
