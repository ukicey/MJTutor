[project]
name = "mjtutor"
version = "0.2.0"
description = "Local Mahjong Soul hanchan review tools for a Mortal-backed coaching agent"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "ukicey" },
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/ukicey/MJTutor"
Repository = "https://github.com/ukicey/MJTutor"
Issues = "https://github.com/ukicey/MJTutor/issues"

[project.scripts]
mjtutor = "mjtutor.cli:main"
mjtutor-mcp = "mjtutor.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/mjtutor/src/mjtutor"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["plugins/mjtutor/src"]
testpaths = ["tests"]
