[project]
name = "mjtutor"
version = "1.1.1"
description = "Mahjong Soul hanchan coaching with Mortal Web and local memory"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "ukicey" },
]
requires-python = ">=3.11"
dependencies = [
    "mahjong>=2.0,<3",
    "mcp>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/ukicey/MJTutor"
Repository = "https://github.com/ukicey/MJTutor"
Issues = "https://github.com/ukicey/MJTutor/issues"

[project.scripts]
mjtutor = "mjtutor.cli:main"
mjtutor-mcp = "mjtutor.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugins/mjtutor/src/mjtutor"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["plugins/mjtutor/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mjtutor"]
